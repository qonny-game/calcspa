<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>両替プランナー</title>
<style>
  :root{
    --bg: #0F2A22;
    --panel: #163B30;
    --panel-2: #1D4A3C;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #F4EFE4;
    --ink-dim: #A8C2B6;
    --ink-faint: #6E8B7D;
    --brass: #C79A56;
    --brass-dim: #8A7043;
    --brass-bg: rgba(199,154,86,0.14);
    --minus: #D97D6C;
    --minus-bg: rgba(217,125,108,0.14);
    --plus: #7FBFA0;
    --plus-bg: rgba(127,191,160,0.14);
    --radius: 14px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 48px;
  }
  .head{
    margin-bottom: 22px;
  }
  .head .eyebrow{
    font-size: 13px;
    color: var(--brass);
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }
  .head h1{
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .head p{
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0;
    line-height: 1.6;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 16px;
  }
  .card.card-table{
    padding: 18px 10px;
  }
  .card-title{
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0 0 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .card-title .sum{
    font-family: "SF Mono","Menlo",monospace;
    font-size: 13px;
    color: var(--brass);
  }

  .row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}

  .coin-label{
    width: 46px;
    flex-shrink:0;
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }
  .coin-label small{
    display:block;
    font-size: 11px;
    color: var(--ink-faint);
    font-weight:400;
    margin-top:1px;
  }

  input[type=number]{
    width: 58px;
    flex-shrink:0;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--ink);
    font-size: 17px;
    font-family: "SF Mono","Menlo",monospace;
    padding: 8px 4px;
    text-align:center;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  input[type=number]:focus{
    outline:none;
    border-color: var(--brass);
    background: rgba(199,154,86,0.08);
  }

  .inline-result{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
    gap: 2px;
    min-width:0;
    text-align:right;
  }
  .inline-result .ir-final{
    font-family:"SF Mono","Menlo",monospace;
    font-weight:700;
    font-size: 22px;
    color: var(--ink);
    line-height:1.1;
  }
  .inline-result .ir-final small{
    font-size: 13px;
    font-weight:500;
    color: var(--ink-faint);
    margin-left:2px;
  }
  .inline-result .ir-sub{
    font-family:"SF Mono","Menlo",monospace;
    font-weight:700;
    font-size: 14px;
    display:flex;
    gap: 8px;
  }
  .inline-result .ir-out{ color: var(--minus); }
  .inline-result .ir-in{ color: var(--plus); }
  .inline-result .ir-short{ color: var(--brass); }

  .result-table{
    width:100%;
    border-collapse: collapse;
    font-size: 11.5px;
    table-layout: fixed;
  }
  .result-table th{
    text-align:center;
    font-weight:500;
    color: var(--ink-faint);
    font-size: 10px;
    padding: 0 1px 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  .result-table th:first-child, .result-table td:first-child{
    text-align:left;
    width: 15%;
  }
  .result-table td{
    text-align:center;
    padding: 9px 1px;
    border-bottom: 1px solid var(--line);
    font-family:"SF Mono","Menlo",monospace;
    color: var(--ink);
  }
  .result-table tr:last-child td{ border-bottom:none; }
  .result-table td.coin-name{
    font-family: inherit;
    font-weight:500;
    color: var(--ink);
    font-size: 12px;
  }
  .result-table td.diff-plus{ color: var(--plus); }
  .result-table td.diff-minus{ color: var(--minus); }
  .result-table td.diff-zero{ color: var(--ink-faint); }
  .result-table td.short-cell{ color: var(--brass); }
  .result-table tr.senbiki-row td{ color: var(--brass); }
  .result-table tr.senbiki-row td.coin-name{ color: var(--brass); }

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-top: 14px;
    margin-top: 4px;
    border-top: 1px solid var(--line-strong);
  }
  .total-row .t-label{
    font-size: 13px;
    color: var(--ink-dim);
  }
  .total-row .t-val{
    font-size: 20px;
    font-family:"SF Mono","Menlo",monospace;
    font-weight:500;
    color: var(--ink);
  }

  .note-bar{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--brass-bg);
    border: 1px solid rgba(199,154,86,0.3);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink);
    line-height:1.6;
  }
  .note-bar .num{
    font-family:"SF Mono","Menlo",monospace;
    font-size: 17px;
    font-weight:500;
    color: var(--brass);
    flex-shrink:0;
  }

  .actions{
    display:flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  button{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    color: var(--ink);
    font-size: 14px;
    padding: 12px;
    font-family: inherit;
  }
  button:active{ transform: scale(0.98); }
  button.reset{ color: var(--ink-dim); }

  .empty{
    text-align:left;
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.7;
    padding: 4px 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <p class="eyebrow">レジ精算ツール</p>
    <h1>両替プランナー</h1>
    <p>いまの硬貨枚数を入れると、上限枚数にいちばん近づく組み合わせを自動で出します。</p>
  </div>

  <div class="card">
    <p class="card-title">
      いまの枚数
      <span class="sum" id="curSum">¥0</span>
    </p>
    <div id="inputRows"></div>
  </div>

  <div class="actions">
    <button id="calcBtn">計算する</button>
    <button id="resetBtn" class="reset">クリア</button>
  </div>

  <div id="resultArea"></div>

</div>

<script>
const COINS = [
  {v:500, label:"500円", cap:26},
  {v:100, label:"100円", cap:50},
  {v:50,  label:"50円",  cap:26},
  {v:10,  label:"10円",  cap:50},
  {v:5,   label:"5円",   cap:30},
  {v:1,   label:"1円",   cap:50},
];

const inputRows = document.getElementById('inputRows');
const curSumEl = document.getElementById('curSum');
const resultArea = document.getElementById('resultArea');

COINS.forEach((c, idx)=>{
  const row = document.createElement('div');
  row.className = 'row';
  const hint = idx === COINS.length-1 ? 'done' : 'next';
  row.innerHTML = `
    <div class="coin-label">${c.label}<small>上限${c.cap}枚</small></div>
    <input type="number" min="0" step="1" inputmode="numeric" enterkeyhint="${hint}" id="in-${c.v}" placeholder="0">
    <div class="inline-result" id="res-${c.v}"></div>
  `;
  inputRows.appendChild(row);
});

// Enter(スマホの「次へ」キー)で次の入力欄に自動フォーカス。最後の欄では計算を実行してキーボードを閉じる
COINS.forEach((c, idx)=>{
  const el = document.getElementById('in-'+c.v);
  el.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const next = COINS[idx+1];
    if(next){
      document.getElementById('in-'+next.v).focus();
    } else {
      el.blur();
      document.getElementById('calcBtn').click();
    }
  });
});

function fmt(n){ return '¥' + n.toLocaleString('ja-JP'); }

function getCurrent(){
  const cur = {};
  COINS.forEach(c=>{
    const el = document.getElementById('in-'+c.v);
    const val = parseInt(el.value,10);
    cur[c.v] = isNaN(val) || val<0 ? 0 : val;
  });
  return cur;
}

function updateSum(){
  const cur = getCurrent();
  let total = 0;
  COINS.forEach(c=> total += c.v*cur[c.v]);
  curSumEl.textContent = fmt(total);
}

inputRows.addEventListener('input', updateSum);

// 硬貨は上限以下で、1000円札で埋め合わせできる金額(TOTALとの差が1000の倍数になる金額)の中から、
// 不足枚数が最小になるものを探す。作りきれなかった残りは1000円札に逃がす。
// 各硬貨は「0枚〜上限枚数」の範囲で自由に選べる(現在の枚数には制約されない)。
// 個数制限つきナップサックのDPで、金額ごとに「最小gap→同点なら最小総枚数」を求める。
function solve(cur){
  const cap = {};
  COINS.forEach(c=> cap[c.v]=c.cap);
  const TOTAL = COINS.reduce((s,c)=> s + c.v*cur[c.v], 0);

  if(TOTAL <= 0){ return {sol:null, total:TOTAL, reason:'empty'}; }

  const capTotal = COINS.reduce((s,c)=> s + c.v*c.cap, 0);
  const senDenom = 1000;
  const targetRemainder = TOTAL % senDenom; // 硬貨合計はTOTALと同じ剰余を持つ必要がある
  const dpMax = Math.min(capTotal, TOTAL);

  const NEG = Infinity;
  const coinsDesc = [500,100,50,10,5,1];

  const dpLayers = [ new Array(dpMax+1).fill(null).map(()=>({gap:NEG, count:NEG})) ];
  dpLayers[0][0] = {gap:0, count:0};

  coinsDesc.forEach((coin, idx)=>{
    const capN = cap[coin];
    const prevLayer = dpLayers[idx];
    const nextLayer = new Array(dpMax+1).fill(null).map(()=>({gap:NEG, count:NEG}));
    for(let amount=0; amount<=dpMax; amount++){
      const prev = prevLayer[amount];
      if(prev.gap === NEG) continue;
      const maxK = Math.min(capN, Math.floor((dpMax-amount)/coin));
      for(let k=0; k<=maxK; k++){
        const na = amount + k*coin;
        const addedGap = capN - k;
        const ng = prev.gap + addedGap;
        const nc = prev.count + k;
        const cell = nextLayer[na];
        if(ng < cell.gap || (ng === cell.gap && nc < cell.count)){
          nextLayer[na] = {gap:ng, count:nc};
        }
      }
    }
    dpLayers.push(nextLayer);
  });

  const lastLayer = dpLayers[coinsDesc.length];
  let bestAmount = -1, bestGap = NEG, bestCount = NEG;
  for(let amount=dpMax; amount>=0; amount--){
    if(amount % senDenom !== targetRemainder) continue;
    const cell = lastLayer[amount];
    if(cell.gap === NEG) continue;
    if(cell.gap < bestGap || (cell.gap === bestGap && cell.count < bestCount)){
      bestGap = cell.gap;
      bestCount = cell.count;
      bestAmount = amount;
    }
  }

  if(bestAmount < 0) return {sol:null, total:TOTAL, reason:'no_solution'};

  const sol = {};
  let amount = bestAmount;
  for(let i=coinsDesc.length-1; i>=0; i--){
    const coin = coinsDesc[i];
    const capN = cap[coin];
    const target = dpLayers[i+1][amount];
    const maxK = Math.min(capN, Math.floor(amount/coin));
    let found = false;
    for(let k=0; k<=maxK; k++){
      const prevAmount = amount - k*coin;
      const prevCell = dpLayers[i][prevAmount];
      if(prevCell.gap === NEG) continue;
      const addedGap = capN - k;
      if(prevCell.gap + addedGap === target.gap && prevCell.count + k === target.count){
        sol[coin] = k;
        amount = prevAmount;
        found = true;
        break;
      }
    }
    if(!found){ sol[coin] = 0; }
  }

  const senbiki = TOTAL - bestAmount;
  return {sol, total:TOTAL, coinTotal:bestAmount, senbiki, senbikiCount: senbiki/senDenom};
}

function render(result, cur){
  resultArea.innerHTML = '';
  // 各入力行の右側をいったんクリア
  COINS.forEach(c=>{
    const el = document.getElementById('res-'+c.v);
    if(el) el.innerHTML = '';
  });

  if(!result || !result.sol){
    const empty = document.createElement('div');
    empty.className = 'card';
    let msg = '枚数を入力して「計算する」を押してください。';
    if(result && result.reason === 'over_cap'){
      msg = `入力の合計 ${fmt(result.total)} は、上限枚数をすべて使った場合の最大額 ${fmt(result.capTotal)} を超えています。上限内には収まらないので、先に一部を両替して合計を減らしてください。`;
    } else if(result && result.reason === 'no_solution'){
      msg = `入力の合計 ${fmt(result.total)} を上限内の組み合わせで作れませんでした。入力内容を見直してください。`;
    }
    empty.innerHTML = `<p class="empty">${msg}</p>`;
    resultArea.appendChild(empty);
    return;
  }
  const sol = result.sol;
  const coinTotal = result.coinTotal;
  const totalCount = [500,100,50,10,5,1].reduce((s,v)=> s + sol[v], 0);

  // 各入力行の右側に、出す/入れる/最終/上限差を直接書き込む
  COINS.forEach(c=>{
    const after = sol[c.v];
    const diff = after - cur[c.v];
    const short = c.cap - after;
    const outVal = diff<0 ? Math.abs(diff) : 0;
    const inVal = diff>0 ? diff : 0;

    let subHtml = '';
    if(outVal>0) subHtml += `<span class="ir-out">−${outVal}</span>`;
    if(inVal>0) subHtml += `<span class="ir-in">+${inVal}</span>`;
    if(short>0) subHtml += `<span class="ir-short">上限差${short}</span>`;

    const el = document.getElementById('res-'+c.v);
    if(el){
      el.innerHTML = `
        <div class="ir-final">${after}<small>枚</small></div>
        <div class="ir-sub">${subHtml}</div>
      `;
    }
  });

  // 合計・1000円札・合計枚数だけ下にカードで表示
  const card = document.createElement('div');
  card.className = 'card';

  const senbikiHtml = result.senbikiCount > 0 ? `
    <div class="total-row">
      <span class="t-label">1000円札(合計には含めない)</span>
      <span class="t-val" style="color:var(--brass);">${result.senbikiCount}枚</span>
    </div>
  ` : '';

  card.innerHTML = `
    <div class="total-row" style="border-top:none; padding-top:0; margin-top:0;">
      <span class="t-label">合計(硬貨のみ)</span>
      <span class="t-val">${fmt(coinTotal)}</span>
    </div>
    <div class="total-row" style="padding-top:4px;">
      <span class="t-label">合計枚数</span>
      <span class="t-val" style="font-size:15px;">${totalCount}枚</span>
    </div>
    ${senbikiHtml}
  `;
  resultArea.appendChild(card);
}

document.getElementById('calcBtn').addEventListener('click', ()=>{
  const cur = getCurrent();
  const result = solve(cur);
  render(result, cur);
  resultArea.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  COINS.forEach(c=>{ document.getElementById('in-'+c.v).value=''; });
  updateSum();
  resultArea.innerHTML = '';
});

updateSum();
</script>
</body>
</html>
