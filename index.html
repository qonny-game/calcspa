<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>両替プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Noto+Sans+JP:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F2A22;
    --panel: #163B30;
    --panel-2: #1D4A3C;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #F4EFE4;
    --ink-dim: #A8C2B6;
    --ink-faint: #6E8B7D;
    --brass: #C79A56;
    --brass-dim: #8A7043;
    --brass-bg: rgba(199,154,86,0.14);
    --minus: #D97D6C;
    --minus-bg: rgba(217,125,108,0.14);
    --plus: #7FBFA0;
    --plus-bg: rgba(127,191,160,0.14);
    --radius: 14px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight: 700;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 48px;
  }
  .head{
    margin-bottom: 22px;
  }
  .head .eyebrow{
    font-size: 13px;
    color: var(--brass);
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }
  .head h1{
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .head p{
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0;
    line-height: 1.6;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 16px;
  }
  .card.card-table{
    padding: 18px 10px;
  }
  .card-title{
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0 0 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .card-title .sum{
    font-family: "Cal Sans","SF Mono","Menlo",monospace;
    font-size: 13px;
    color: var(--brass);
  }

  .main-table{
    width:100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .main-table th{
    text-align:center;
    font-weight:800;
    color: var(--ink-faint);
    font-size: 15px;
    padding: 0 2px 12px;
    border-bottom: 1px solid var(--line-strong);
  }
  .main-table th.col-coin{ text-align:left; width: 20%; }
  .main-table th.col-input{ width: 18%; }

  .main-table td{
    text-align:center;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    vertical-align:middle;
  }
  .main-table tr:last-child td{ border-bottom:none; }

  .main-table td.coin-name{
    text-align:left;
    font-weight:800;
    font-size: 18px;
    color: var(--ink);
    line-height:1.25;
    white-space: nowrap;
  }
  .main-table td.coin-name small{
    font-size: 11px;
    font-weight:500;
    color: var(--ink-faint);
  }

  .main-table td.input-cell{ padding: 6px 2px; }
  input[type=number]{
    width: 100%;
    max-width: 62px;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    color: var(--ink);
    font-size: 21px;
    font-weight:700;
    font-family: "Cal Sans","SF Mono","Menlo",monospace;
    padding: 8px 2px;
    text-align:center;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  input[type=number]:focus{
    outline:none;
    border-color: var(--brass);
    background: rgba(199,154,86,0.08);
  }

  .main-table td.res-out,
  .main-table td.res-in,
  .main-table td.res-final,
  .main-table td.res-short{
    font-family:"Cal Sans","SF Mono","Menlo",monospace;
    font-weight:800;
    font-size: 21px;
    color: var(--ink-faint);
  }
  .main-table td.res-out.active{ color: var(--minus); }
  .main-table td.res-in.active{ color: var(--plus); }
  .main-table td.res-final{ color: var(--ink); font-size:23px; }
  .main-table td.res-short{ color: var(--brass); font-size:19px; font-weight:700; }
  .main-table td.res-static{
    font-family:"Cal Sans","SF Mono","Menlo",monospace;
    font-weight:700;
    font-size: 19px;
    color: var(--ink-faint);
  }
  .main-table td#senbiki-final{ color: var(--brass); }

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-top: 14px;
    margin-top: 4px;
    border-top: 1px solid var(--line-strong);
  }
  .total-row .t-label{
    font-size: 13px;
    color: var(--ink-dim);
  }
  .total-row .t-val{
    font-size: 20px;
    font-family:"Cal Sans","SF Mono","Menlo",monospace;
    font-weight:500;
    color: var(--ink);
  }

  .note-bar{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--brass-bg);
    border: 1px solid rgba(199,154,86,0.3);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink);
    line-height:1.6;
  }
  .note-bar .num{
    font-family:"Cal Sans","SF Mono","Menlo",monospace;
    font-size: 17px;
    font-weight:500;
    color: var(--brass);
    flex-shrink:0;
  }

  .actions{
    display:flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  button{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    color: var(--ink);
    font-size: 14px;
    padding: 12px;
    font-family: inherit;
  }
  button:active{ transform: scale(0.98); }
  button.reset{ color: var(--ink-dim); }

  .empty{
    text-align:left;
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.7;
    padding: 4px 0;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <p class="eyebrow">レジ精算ツール</p>
    <h1>両替プランナー</h1>
    <p>いまの硬貨枚数を入れると、上限枚数にいちばん近づく組み合わせを自動で出します。</p>
  </div>

  <div class="card card-table">
    <p class="card-title">
      いまの枚数
      <span class="sum" id="curSum">¥0</span>
    </p>
    <table class="main-table">
      <thead>
        <tr>
          <th class="col-coin">硬</th>
          <th class="col-input">現</th>
          <th class="col-out">出</th>
          <th class="col-in">入</th>
          <th class="col-final">終</th>
          <th class="col-short">不</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="coin-name">1000円<small>札</small></td>
          <td class="res-static">-</td>
          <td class="res-out" id="senbiki-out">-</td>
          <td class="res-in" id="senbiki-in">-</td>
          <td class="res-final" id="senbiki-final">-</td>
          <td class="res-static">-</td>
        </tr>
      </tbody>
      <tbody id="inputRows"></tbody>
    </table>
  </div>

  <div class="actions">
    <button id="calcBtn">計算する</button>
    <button id="resetBtn" class="reset">クリア</button>
  </div>

  <div id="resultArea"></div>

</div>

<script>
const COINS = [
  {v:500, label:"500円", cap:26},
  {v:100, label:"100円", cap:50},
  {v:50,  label:"50円",  cap:26},
  {v:10,  label:"10円",  cap:50},
  {v:5,   label:"5円",   cap:30},
  {v:1,   label:"1円",   cap:50},
];

const inputRows = document.getElementById('inputRows');
const curSumEl = document.getElementById('curSum');
const resultArea = document.getElementById('resultArea');

COINS.forEach((c, idx)=>{
  const row = document.createElement('tr');
  const hint = idx === COINS.length-1 ? 'done' : 'next';
  row.innerHTML = `
    <td class="coin-name">${c.label}</td>
    <td class="input-cell"><input type="number" min="0" step="1" inputmode="numeric" enterkeyhint="${hint}" id="in-${c.v}" placeholder="0"></td>
    <td class="res-out" id="out-${c.v}">-</td>
    <td class="res-in" id="ires-${c.v}">-</td>
    <td class="res-final" id="final-${c.v}">-</td>
    <td class="res-short" id="short-${c.v}">-</td>
  `;
  inputRows.appendChild(row);
});

// Enter(スマホの「次へ」キー)で次の入力欄に自動フォーカス。最後の欄では計算を実行してキーボードを閉じる
COINS.forEach((c, idx)=>{
  const el = document.getElementById('in-'+c.v);
  el.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const next = COINS[idx+1];
    if(next){
      document.getElementById('in-'+next.v).focus();
    } else {
      el.blur();
      document.getElementById('calcBtn').click();
    }
  });
});

function fmt(n){ return '¥' + n.toLocaleString('ja-JP'); }

function getCurrent(){
  const cur = {};
  COINS.forEach(c=>{
    const el = document.getElementById('in-'+c.v);
    const val = parseInt(el.value,10);
    cur[c.v] = isNaN(val) || val<0 ? 0 : val;
  });
  return cur;
}

function updateSum(){
  const cur = getCurrent();
  let total = 0;
  COINS.forEach(c=> total += c.v*cur[c.v]);
  curSumEl.textContent = fmt(total);
}

inputRows.addEventListener('input', updateSum);

// 硬貨は上限以下で、1000円札とやり取りして埋め合わせできる金額
// (TOTALとの差が1000の倍数になる金額)の中から、不足枚数が最小になるものを探す。
// 1000円札は投入(硬貨を増やす)・回収(硬貨の超過分を引き取る)のどちらの方向にも無制限に使える。
// 各硬貨は「0枚〜上限枚数」の範囲で自由に選べる(現在の枚数には制約されない)。
// 個数制限つきナップサックのDPで、金額ごとに「最小gap→同点なら最小総枚数」を求める。
function solve(cur){
  const cap = {};
  COINS.forEach(c=> cap[c.v]=c.cap);
  const TOTAL = COINS.reduce((s,c)=> s + c.v*cur[c.v], 0);

  if(TOTAL < 0){ return {sol:null, total:TOTAL, reason:'empty'}; }

  const capTotal = COINS.reduce((s,c)=> s + c.v*c.cap, 0);
  const senDenom = 1000;
  const targetRemainder = TOTAL % senDenom; // 硬貨合計はTOTALと同じ剰余を持つ必要がある
  const dpMax = capTotal; // 1000円札を投入すれば上限総額まで硬貨を増やせる

  const NEG = Infinity;
  const coinsDesc = [500,100,50,10,5,1];

  const dpLayers = [ new Array(dpMax+1).fill(null).map(()=>({gap:NEG, count:NEG})) ];
  dpLayers[0][0] = {gap:0, count:0};

  coinsDesc.forEach((coin, idx)=>{
    const capN = cap[coin];
    const prevLayer = dpLayers[idx];
    const nextLayer = new Array(dpMax+1).fill(null).map(()=>({gap:NEG, count:NEG}));
    for(let amount=0; amount<=dpMax; amount++){
      const prev = prevLayer[amount];
      if(prev.gap === NEG) continue;
      const maxK = Math.min(capN, Math.floor((dpMax-amount)/coin));
      for(let k=0; k<=maxK; k++){
        const na = amount + k*coin;
        const addedGap = capN - k;
        const ng = prev.gap + addedGap;
        const nc = prev.count + k;
        const cell = nextLayer[na];
        if(ng < cell.gap || (ng === cell.gap && nc < cell.count)){
          nextLayer[na] = {gap:ng, count:nc};
        }
      }
    }
    dpLayers.push(nextLayer);
  });

  const lastLayer = dpLayers[coinsDesc.length];
  let bestAmount = -1, bestGap = NEG, bestCount = NEG;
  for(let amount=dpMax; amount>=0; amount--){
    if(amount % senDenom !== targetRemainder) continue;
    const cell = lastLayer[amount];
    if(cell.gap === NEG) continue;
    if(cell.gap < bestGap || (cell.gap === bestGap && cell.count < bestCount)){
      bestGap = cell.gap;
      bestCount = cell.count;
      bestAmount = amount;
    }
  }

  if(bestAmount < 0) return {sol:null, total:TOTAL, reason:'no_solution'};

  const sol = {};
  let amount = bestAmount;
  for(let i=coinsDesc.length-1; i>=0; i--){
    const coin = coinsDesc[i];
    const capN = cap[coin];
    const target = dpLayers[i+1][amount];
    const maxK = Math.min(capN, Math.floor(amount/coin));
    let found = false;
    for(let k=0; k<=maxK; k++){
      const prevAmount = amount - k*coin;
      const prevCell = dpLayers[i][prevAmount];
      if(prevCell.gap === NEG) continue;
      const addedGap = capN - k;
      if(prevCell.gap + addedGap === target.gap && prevCell.count + k === target.count){
        sol[coin] = k;
        amount = prevAmount;
        found = true;
        break;
      }
    }
    if(!found){ sol[coin] = 0; }
  }

  const senbiki = TOTAL - bestAmount; // 正: 1000円札を受け取る(回収) / 負: 1000円札を投入する
  return {sol, total:TOTAL, coinTotal:bestAmount, senbiki, senbikiCount: Math.abs(senbiki)/senDenom, senbikiDir: senbiki>0 ? 'out' : (senbiki<0 ? 'in' : 'none')};
}

function render(result, cur){
  resultArea.innerHTML = '';
  // 各行の計算結果セルをいったんクリア
  COINS.forEach(c=>{
    document.getElementById('out-'+c.v).textContent = '-';
    document.getElementById('out-'+c.v).className = 'res-out';
    document.getElementById('ires-'+c.v).textContent = '-';
    document.getElementById('ires-'+c.v).className = 'res-in';
    document.getElementById('final-'+c.v).textContent = '-';
    document.getElementById('short-'+c.v).textContent = '-';
  });
  document.getElementById('senbiki-out').textContent = '-';
  document.getElementById('senbiki-out').className = 'res-out';
  document.getElementById('senbiki-in').textContent = '-';
  document.getElementById('senbiki-in').className = 'res-in';
  document.getElementById('senbiki-final').textContent = '-';

  if(!result || !result.sol){
    const empty = document.createElement('div');
    empty.className = 'card';
    let msg = '枚数を入力して「計算する」を押してください。';
    if(result && result.reason === 'over_cap'){
      msg = `入力の合計 ${fmt(result.total)} は、上限枚数をすべて使った場合の最大額 ${fmt(result.capTotal)} を超えています。上限内には収まらないので、先に一部を両替して合計を減らしてください。`;
    } else if(result && result.reason === 'no_solution'){
      msg = `入力の合計 ${fmt(result.total)} を上限内の組み合わせで作れませんでした。入力内容を見直してください。`;
    }
    empty.innerHTML = `<p class="empty">${msg}</p>`;
    resultArea.appendChild(empty);
    return;
  }
  const sol = result.sol;
  const coinTotal = result.coinTotal;
  const totalCount = [500,100,50,10,5,1].reduce((s,v)=> s + sol[v], 0);

  // 各行のセルに、出す/入れる/最終/上限差を書き込む
  COINS.forEach(c=>{
    const after = sol[c.v];
    const diff = after - cur[c.v];
    const short = c.cap - after;
    const outVal = diff<0 ? Math.abs(diff) : 0;
    const inVal = diff>0 ? diff : 0;

    const outEl = document.getElementById('out-'+c.v);
    const inEl = document.getElementById('ires-'+c.v);
    const finalEl = document.getElementById('final-'+c.v);
    const shortEl = document.getElementById('short-'+c.v);

    if(outVal>0){ outEl.textContent = outVal; outEl.className = 'res-out active'; }
    if(inVal>0){ inEl.textContent = inVal; inEl.className = 'res-in active'; }
    finalEl.textContent = after;
    shortEl.textContent = short>0 ? short : '-';
  });

  if(result.senbikiDir === 'out'){
    const el = document.getElementById('senbiki-out');
    el.textContent = result.senbikiCount;
    el.className = 'res-out active';
  } else if(result.senbikiDir === 'in'){
    const el = document.getElementById('senbiki-in');
    el.textContent = result.senbikiCount;
    el.className = 'res-in active';
  }

  // 合計・合計枚数だけ下にカードで表示
  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="total-row" style="border-top:none; padding-top:0; margin-top:0;">
      <span class="t-label">合計(硬貨のみ)</span>
      <span class="t-val">${fmt(coinTotal)}</span>
    </div>
    <div class="total-row" style="padding-top:4px;">
      <span class="t-label">合計枚数</span>
      <span class="t-val" style="font-size:15px;">${totalCount}枚</span>
    </div>
  `;
  resultArea.appendChild(card);
}

document.getElementById('calcBtn').addEventListener('click', ()=>{
  const cur = getCurrent();
  const result = solve(cur);
  render(result, cur);
  resultArea.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  COINS.forEach(c=>{
    document.getElementById('in-'+c.v).value='';
    document.getElementById('out-'+c.v).textContent = '-';
    document.getElementById('out-'+c.v).className = 'res-out';
    document.getElementById('ires-'+c.v).textContent = '-';
    document.getElementById('ires-'+c.v).className = 'res-in';
    document.getElementById('final-'+c.v).textContent = '-';
    document.getElementById('short-'+c.v).textContent = '-';
  });
  document.getElementById('senbiki-out').textContent = '-';
  document.getElementById('senbiki-out').className = 'res-out';
  document.getElementById('senbiki-in').textContent = '-';
  document.getElementById('senbiki-in').className = 'res-in';
  document.getElementById('senbiki-final').textContent = '-';
  updateSum();
  resultArea.innerHTML = '';
});

updateSum();
</script>
</body>
</html>
